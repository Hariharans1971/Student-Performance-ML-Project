name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Reproducible ML evaluation and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project requirements
        run: python -m pip install -r requirements.txt

      - name: Compile Python source
        run: python -m compileall -q Project.py evaluate_model.py tests

      - name: Run evaluation tests
        run: python -m unittest discover -s tests -v

      - name: Run reproducible evaluation on the tracked dataset
        run: python evaluate_model.py
